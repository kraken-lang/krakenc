name: CI

# Tests run on every push and PR across Windows, Linux, macOS.
# Tagged release builds are in release.yml.
#
# Bootstrap chain (no external compiler dependency at this level):
#   1. clang src/main.c -o krakenc      -> stage2 (Kraken-self-hosted krakenc)
#   2. tools/run-tests.sh                -> verify both backends
#   3. emit-c, save, re-emit, compare    -> gen2/gen3 fixed-point check
#
# src/main.c is committed as the portable bootstrap source. It is regenerated
# from src/main.kr (and the rest of src/*.kr) whenever the source changes; the
# regen is committed alongside the .kr edit. The same main.c builds on all
# three platforms via #ifdef-gated platform code.

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows-x64
            runner: windows-latest
            exe_ext: .exe
            cc_extra: '-D_CRT_SECURE_NO_WARNINGS'
          - os_name: linux-x64
            runner: ubuntu-latest
            exe_ext: ''
            cc_extra: '-lm -lpthread'
          - os_name: macos-arm64
            runner: macos-latest
            exe_ext: ''
            cc_extra: '-lm'

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      # ---------- install clang ----------
      - name: Install clang (Windows)
        if: matrix.os_name == 'windows-x64'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install clang (Linux)
        if: matrix.os_name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      # macOS runners ship with clang via Xcode CLT; nothing to install.

      - name: Verify clang
        run: clang --version

      # ---------- build stage2 from the committed bootstrap C source ----------
      - name: Build krakenc
        run: |
          clang -o krakenc${{ matrix.exe_ext }} src/main.c -Wno-int-conversion ${{ matrix.cc_extra }}

      # ---------- run tests (both backends) ----------
      - name: Run tests
        run: |
          chmod +x tools/run-tests.sh
          KRAKENC=./krakenc${{ matrix.exe_ext }} bash tools/run-tests.sh

      # ---------- self-host fixed point check ----------
      # Skipped on Linux because emitting main.kr currently peaks at ~24 GB
      # RSS (kr_str_concat in the runtime never frees its inputs, leading to
      # O(N^2) memory growth across the translator). GitHub Linux runners cap
      # at 7 GB, so the runner gets OOM-killed mid-emit. The fix is a runtime
      # change tracked for 0.9.4. Determinism is still verified on Windows and
      # macOS, which gives us regression coverage from two independent OS/libc
      # combinations.
      - name: Verify gen2/gen3 fixed point (C backend)
        if: matrix.os_name != 'linux-x64'
        run: |
          export KRAKENC_INPUT=src/main.kr
          export KRAKENC_MODE=emit-c
          ./krakenc${{ matrix.exe_ext }}
          cp src/main.c src/main_gen2.c
          ./krakenc${{ matrix.exe_ext }}
          if cmp -s src/main_gen2.c src/main.c; then
            echo "gen2 == gen3 fixed point holds"
          else
            echo "::error::gen2 != gen3 - self-host fixed point broken"
            diff src/main_gen2.c src/main.c | head -40 || true
            exit 1
          fi
