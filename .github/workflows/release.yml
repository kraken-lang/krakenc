name: Release

# Builds krakenc + bundled clang on Windows / Linux / macOS when a v* tag is
# pushed, and uploads three release archives to the GitHub release.
#
# Bootstrap chain (same as ci.yml):
#   1. Checkout sibling kraken-lang/kraken (Rust + LLVM compiler) repo
#   2. cargo build --release -p kraken     -> stage1 (Rust krakenc)
#   3. stage1 src/main.kr --emit-c         -> src/main.c (cross-targeted to runner)
#   4. clang src/main.c -o krakenc         -> stage2 (Kraken-self-hosted krakenc)
#   5. vendor clang for the release bundle, smoke-test, package, upload.
#
# Manual trigger also supported (workflow_dispatch) for dry-run testing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    name: ${{ matrix.os_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows-x64
            runner: windows-latest
            archive: zip
            exe_ext: .exe
            llvm_path: 'C:\Program Files\LLVM'
            target: x86_64-pc-windows-msvc
          - os_name: linux-x64
            runner: ubuntu-latest
            archive: tar.gz
            exe_ext: ''
            llvm_path: /usr/lib/llvm-18
            target: x86_64-unknown-linux-gnu
          - os_name: macos-arm64
            runner: macos-latest
            archive: tar.gz
            exe_ext: ''
            llvm_path: /opt/homebrew/opt/llvm@18
            target: aarch64-apple-darwin

    defaults:
      run:
        shell: bash

    env:
      LLVM_SYS_180_PREFIX: ${{ matrix.llvm_path }}

    steps:
      - uses: actions/checkout@v5

      # ---------- install LLVM/clang on each runner ----------
      - name: Install LLVM (Windows)
        if: matrix.os_name == 'windows-x64'
        shell: pwsh
        run: |
          choco install llvm --version=18.1.8 -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install LLVM (Linux)
        if: matrix.os_name == 'linux-x64'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y libzstd-dev libpolly-18-dev clang-18 lld-18
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/lld-18 /usr/local/bin/ld.lld

      - name: Install LLVM (macOS)
        if: matrix.os_name == 'macos-arm64'
        run: |
          brew install llvm@18 zstd
          echo "/opt/homebrew/opt/llvm@18/bin" >> $GITHUB_PATH
          echo "LIBRARY_PATH=$(brew --prefix zstd)/lib:$LIBRARY_PATH" >> $GITHUB_ENV

      # ---------- bootstrap: build stage1 from sibling kraken Rust repo ----------
      - name: Checkout kraken (Rust bootstrap)
        uses: actions/checkout@v5
        with:
          repository: kraken-lang/kraken
          path: kraken-bootstrap

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kraken-bootstrap/target
          key: ${{ runner.os }}-cargo-stage1-${{ hashFiles('kraken-bootstrap/Cargo.lock') }}

      - name: Build kraken-runtime (required by stage1)
        working-directory: kraken-bootstrap
        run: bash runtime/build.sh

      - name: Build stage1 (kraken Rust compiler)
        working-directory: kraken-bootstrap
        run: cargo build --release -p kraken

      # ---------- bootstrap stage2 (Kraken-self-hosted krakenc) ----------
      - name: Emit krakenc C source via stage1
        run: |
          export KRAKENC_INPUT=src/main.kr
          export KRAKENC_MODE=emit-c
          export KRAKENC_TARGET=${{ matrix.target }}
          ./kraken-bootstrap/target/release/kraken${{ matrix.exe_ext }}

      - name: Build stage2 (Kraken-self-hosted krakenc)
        run: |
          clang \
            -o krakenc${{ matrix.exe_ext }} \
            src/main.c \
            -Wno-int-conversion \
            -D_CRT_SECURE_NO_WARNINGS \
            $([ "${{ matrix.os_name }}" = "linux-x64" ] && echo "-lm -lpthread") \
            $([ "${{ matrix.os_name }}" = "macos-arm64" ] && echo "-lm")

      # ---------- vendor clang for the release bundle ----------
      - name: Run vendor script (Windows)
        if: matrix.os_name == 'windows-x64'
        shell: pwsh
        run: pwsh tools\vendor-clang.ps1

      - name: Run vendor script (POSIX)
        if: matrix.os_name != 'windows-x64'
        run: bash tools/vendor-clang.sh

      # ---------- run smoke tests ----------
      - name: Smoke test (both backends)
        run: |
          chmod +x tools/run-tests.sh
          KRAKENC=./krakenc${{ matrix.exe_ext }} bash tools/run-tests.sh

      # ---------- assemble release archive ----------
      - name: Stage release dir
        run: |
          mkdir -p kraken-release/bin kraken-release/examples
          cp krakenc${{ matrix.exe_ext }} kraken-release/bin/
          cp -r tools/llvm kraken-release/llvm
          cp -r examples/* kraken-release/examples/ 2>/dev/null || true
          cp README.md LICENSE kraken-release/

      - name: Pack archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "krakenc-${{ github.ref_name }}-${{ matrix.os_name }}.zip"
          Compress-Archive -Path kraken-release\* -DestinationPath $name
          echo "ARCHIVE=$name" >> $env:GITHUB_ENV

      - name: Pack archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          name="krakenc-${{ github.ref_name }}-${{ matrix.os_name }}.tar.gz"
          tar czf "$name" -C kraken-release .
          echo "ARCHIVE=$name" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: krakenc-${{ matrix.os_name }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          draft: true
          generate_release_notes: true
