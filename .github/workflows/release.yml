name: Release

# Builds krakenc + bundled clang on Windows / Linux / macOS when a v* tag is
# pushed, and uploads three release archives to the GitHub release.
#
# Bootstrap chain:
#   1. clang src/main.c -o krakenc      -> stage2 (Kraken-self-hosted krakenc)
#   2. vendor a clang toolchain         -> tools/llvm/
#   3. smoke-test, package, upload
#
# src/main.c is the portable bootstrap source committed in the repo. The same
# main.c builds on all three platforms via #ifdef-gated platform code.
#
# Manual trigger also supported (workflow_dispatch) for dry-run testing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    name: ${{ matrix.os_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows-x64
            runner: windows-latest
            archive: zip
            exe_ext: .exe
            cc_extra: '-D_CRT_SECURE_NO_WARNINGS'
          - os_name: linux-x64
            runner: ubuntu-latest
            archive: tar.gz
            exe_ext: ''
            cc_extra: '-lm -lpthread'
          - os_name: macos-arm64
            runner: macos-latest
            archive: tar.gz
            exe_ext: ''
            cc_extra: '-lm'

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      # ---------- install clang ----------
      - name: Install clang (Windows)
        if: matrix.os_name == 'windows-x64'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install clang (Linux)
        if: matrix.os_name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      # macOS runners ship with clang via Xcode CLT; nothing to install.

      - name: Verify clang
        run: clang --version

      # ---------- build krakenc from the committed bootstrap C source ----------
      - name: Build krakenc
        run: |
          clang -o krakenc${{ matrix.exe_ext }} src/main.c -Wno-int-conversion ${{ matrix.cc_extra }}

      # ---------- vendor clang for the release bundle ----------
      # macOS is intentionally not bundled — Homebrew clang is a small wrapper
      # that aborts when copied to a new location, and macOS users get clang
      # via Xcode Command Line Tools by default. The macOS archive ships only
      # the krakenc binary; users compile their .c output with system clang.
      - name: Run vendor script (Windows)
        if: matrix.os_name == 'windows-x64'
        shell: pwsh
        run: pwsh tools\vendor-clang.ps1

      - name: Run vendor script (Linux)
        if: matrix.os_name == 'linux-x64'
        run: bash tools/vendor-clang.sh

      # ---------- run smoke tests ----------
      - name: Smoke test (both backends)
        run: |
          chmod +x tools/run-tests.sh
          KRAKENC=./krakenc${{ matrix.exe_ext }} bash tools/run-tests.sh

      # ---------- assemble release archive ----------
      - name: Stage release dir
        run: |
          mkdir -p kraken-release/bin
          cp krakenc${{ matrix.exe_ext }} kraken-release/bin/
          if [ -d tools/llvm ]; then
            cp -r tools/llvm kraken-release/llvm
          fi
          cp README.md LICENSE kraken-release/

      - name: Pack archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "krakenc-${{ github.ref_name }}-${{ matrix.os_name }}.zip"
          Compress-Archive -Path kraken-release\* -DestinationPath $name
          echo "ARCHIVE=$name" >> $env:GITHUB_ENV

      - name: Pack archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          name="krakenc-${{ github.ref_name }}-${{ matrix.os_name }}.tar.gz"
          tar czf "$name" -C kraken-release .
          echo "ARCHIVE=$name" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: krakenc-${{ matrix.os_name }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          draft: true
          generate_release_notes: true
